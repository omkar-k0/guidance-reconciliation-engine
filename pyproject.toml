[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gre"
version = "0.1.0"
description = "Confidence-gated reconciliation of company revenue guidance against reported results (SEC EDGAR)"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gre = "gre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
